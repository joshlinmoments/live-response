<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>讓 AI 幫你騰出雙手 · 即時回應</title>
<meta name="description" content="課堂即時回應系統：掃碼作答，回應即時上牆。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect x='30' y='28' width='60' height='44' rx='14' fill='%23F3E9D4' stroke='%23A8803F' stroke-width='5'/%3E%3Ccircle cx='60' cy='48' r='12' fill='%23A8803F'/%3E%3Ccircle cx='60' cy='48' r='4.5' fill='%23F3E9D4'/%3E%3Cline x1='60' y1='28' x2='60' y2='16' stroke='%23A8803F' stroke-width='5'/%3E%3Ccircle cx='60' cy='13' r='5' fill='%232B2520'/%3E%3Crect x='40' y='76' width='40' height='24' rx='8' fill='%23F3E9D4' stroke='%23A8803F' stroke-width='5'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Roboto+Condensed:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/@hanzi.pro/webfonts-genyo-gothic-tc/swap.css" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=26" />
</head>
<body>

<div class="wrap">

  <!-- ══════════ ① 手機介面（學員） ══════════ -->
  <main id="view-join" hidden>
    <img class="hero-poster" src="assets/img/hero-poster.jpg?v=20" alt="讓 AI 幫你騰出雙手 · Let AI Lend a Hand（2026/10/11 林瑋揚 學習分享）" />
    <div id="join-body"></div>
  </main>

  <!-- ══════════ ② 投影介面（大畫面） ══════════ -->
  <div id="view-screen" hidden>
    <div class="join-chip" id="s-qrwrap" hidden>
      <div id="s-qrchip" class="qrchip"></div>
      <div class="chip-txt"><b>掃碼加入</b><span class="en">Scan to join</span></div>
    </div>
    <div class="screen-stage" id="s-stage"></div>
    <div class="wall" id="s-wall"></div>
    <div class="qr-overlay" id="s-qr-ov" hidden>
      <div class="qr-box"><h3>掃碼加入作答</h3><div class="sub en">Scan to join</div>
        <div id="s-qr-ovbox"></div><div class="qr-url" id="s-qr-ovurl"></div></div>
    </div>
  </div>

  <!-- ══════════ ③ 主持介面（控制台） ══════════ -->
  <div id="view-host" hidden>
    <header class="host-top">
      <div class="host-brand">
        <svg width="42" height="42" viewBox="0 0 120 120" fill="none" aria-hidden="true">
          <rect x="30" y="26" width="60" height="44" rx="14" fill="#FBF5E8" stroke="#A8803F" stroke-width="3"/>
          <circle cx="60" cy="46" r="12" fill="#A8803F" stroke="#87682F" stroke-width="3"/><circle cx="60" cy="46" r="4.5" fill="#FBF5E8"/>
          <line x1="60" y1="26" x2="60" y2="16" stroke="#A8803F" stroke-width="3"/><circle cx="60" cy="14" r="4" fill="#2B2520"/>
          <rect x="38" y="74" width="44" height="26" rx="9" fill="#FBF5E8" stroke="#A8803F" stroke-width="3"/>
        </svg>
        <div class="t"><span id="h-brand-zh">讓 AI 幫你騰出雙手</span><small id="h-brand-en">Let AI Lend a Hand</small><em class="host-tag">主持控制台 HOST</em></div>
      </div>
      <div class="host-top-right">
        <span class="pill" id="h-room">場次 main</span>
        <span class="pill" id="h-qpos">共 0 題</span>
        <button class="btn jade sm" id="h-open-screen">開啟投影畫面 ↗</button>
      </div>
    </header>

    <div class="host-panel">
      <section class="ctrl-card">
        <div class="card-label">目前題目 · NOW SHOWING</div>
        <div id="h-now"></div>

        <div class="step-row">
          <button class="btn ghost" id="h-prev">◀ 上一頁</button>
          <button class="btn jade" id="h-next">下一頁 ▶</button>
        </div>

        <div id="h-qctrls">
          <div class="toggle-grid">
            <label class="toggle"><input type="checkbox" id="h-accept" checked><span class="sw"></span>開放作答</label>
            <label class="toggle"><input type="checkbox" id="h-reveal" checked><span class="sw"></span>投影顯示牆面</label>
          </div>
        </div>
        <div class="toggle-grid">
          <label class="toggle"><input type="checkbox" id="h-showqr"><span class="sw"></span>投影放大 QR（蓋滿投影）</label>
        </div>

        <div class="btn-row">
          <button class="btn ghost sm" id="h-home">⟲ 回到首頁</button>
          <button class="btn ghost sm" id="h-setup">⚙ 設定題目</button>
          <button class="btn ghost sm" id="h-clear">清除本題回應</button>
          <button class="btn ghost sm" id="h-clear-all">清除全部</button>
        </div>

        <div class="qr-inline">
          <div id="h-qr" class="qrchip"></div>
          <div class="qr-inline-txt"><b>學員作答網址</b><span class="qr-inline-url" id="h-joinurl"></span><span class="en" style="color:var(--ink-soft)">投影畫面也會顯示此 QR</span></div>
        </div>
      </section>

      <section class="mod-card">
        <div class="card-label">本題回應 · <b id="h-count2">0</b> 則（點 ✕ 可移除不當留言）</div>
        <div id="h-modlist" class="modlist"></div>
      </section>
    </div>
  </div>

</div>

<!-- 設定題目疊層 -->
<div class="setup-overlay" id="setup-overlay" hidden>
  <div class="setup-box">
    <h3>設定題目</h3>
    <div class="desc">題目會即時同步到每位學員手機與投影畫面。中文必填、英文可留白。上課中也能隨時修改。</div>
    <input id="set-title" style="width:100%;font-family:var(--font-cjk);font-weight:700;font-size:18px;border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;color:var(--ink)" placeholder="活動標題（中文）" />
    <input id="set-title-en" style="width:100%;font-family:var(--font-en);font-style:italic;font-size:16px;border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:18px;background:#fff;color:var(--ink)" placeholder="Title (English, optional)" />
    <div id="q-edit-list"></div>
    <div class="setup-actions">
      <button class="btn ghost" id="q-add">＋ 新增一題</button>
      <button class="btn jade" id="set-save" style="margin-left:auto">儲存</button>
      <button class="btn ghost" id="set-cancel">取消</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="firebase-config.js?v=26"></script>
<script src="app.js?v=26"></script>
</body>
</html>
